
<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f6;
            color: #282c3f;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        .heading {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .profile-card {
            background: white;
            border: 1px solid #eaeaec;
            padding: 35px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eaeaec;
            margin-bottom: 25px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #ffe0e8;
            color: #ff3f6c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        .profile-header h2 {
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #7e818c;
            font-size: 14px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 25px;
        }

        .field label {
            display: block;
            color: #7e818c;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .field p {
            font-size: 15px;
            line-height: 1.6;
        }

        .edit-btn {
            background: white;
            border: 1px solid #ff3f6c;
            color: #ff3f6c;
            padding: 13px 28px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }

        .edit-btn:hover {
            background: #fff0f4;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .profile-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="heading">My Profile</h1>

        <div class="profile-card">

            <div class="profile-header">
                <div class="avatar">K</div>

                <div>
                    <h2 id="name">Kanisha</h2>
                    <p>Welcome to your profile</p>
                </div>
            </div>

            <h3 class="section-title">
                Personal Information
            </h3>

            <div class="field">
                <label>Full Name</label>
                <p id="fullname">Kanisha</p>
            </div>

            <div class="field">
                <label>Favorite App</label>
                <p id="app">Instagram</p>
            </div>

            <div class="field">
                <label>About Me</label>
                <p id="bio">
                    I am a student learning Java, web development,
                    HTML and database programming.
                </p>
            </div>

            <div class="field">
                <label>Profile Type</label>
                <p>Student</p>
            </div>

            <button class="edit-btn" onclick="editProfile()">
                EDIT PROFILE
            </button>

        </div>
    </div>

    <script>
        function editProfile() {
            let name = prompt("Enter your full name:",
                document.getElementById("fullname").innerText);

            if (name !== null && name.trim() !== "") {
                document.getElementById("name").innerText = name;
                document.getElementById("fullname").innerText = name;
                document.querySelector(".avatar").innerText =
                    name.trim().charAt(0).toUpperCase();
            }

            let app = prompt("Enter your favorite app:",
                document.getElementById("app").innerText);

            if (app !== null && app.trim() !== "") {
                document.getElementById("app").innerText = app;
            }

            let bio = prompt("Enter your bio:",
                document.getElementById("bio").innerText);

            if (bio !== null && bio.trim() !== "") {
                document.getElementById("bio").innerText = bio;
            }
        }
    </script>

</body>
</html>
